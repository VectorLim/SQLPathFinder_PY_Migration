[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlpathfinder-runtime"
version = "0.1.0"
description = "Original ScriptHost runtime checkout prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas==3.0.3",
    "openpyxl>=3.1,<4",
    "requests>=2.32,<3",
    "xlrd>=2,<3",
    "dask[dataframe]",
    "rich",
    "chardet",
    "tabulate",
]

[project.optional-dependencies]
live = ["datasyncx==1.1.6"]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
datasyncx = { git = "https://mfg-github.mfg.intel.com/intel-manufacturing/applications.manufacturing.analytics.atm.datasyncx", tag = "1.1.6" }

[[tool.uv.index]]
name = "tmg"
url = "https://tmg-repo.mfg.intel.com/pypi-s3-prod/simple/"
default = true

[tool.uv]
system-certs = true

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["scripthost_portable*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
search-path = ["src"]
