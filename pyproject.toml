[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vg2c"
version = "0.1.0"
description = "Stepwise VG2 compiler migration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasyncx",
    "keyring==25.7.0",
    "pandas==3.0.3",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
vg2c = "vg2c.cli:main"
vg2c-ui = "vg2c_ui.__main__:main"

[tool.uv.sources]
datasyncx = { git = "https://mfg-github.mfg.intel.com/intel-manufacturing/applications.manufacturing.analytics.atm.datasyncx", tag = "1.1.6" }

[[tool.uv.index]]
name = "tmg"
url = "https://tmg-repo.mfg.intel.com/pypi-s3-prod/simple/"
default = true

[tool.uv]
system-certs = true

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
vg2c_ui = ["static/*", "static/assets/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
search-path = ["src"]