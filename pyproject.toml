[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vg2c"
version = "0.1.0"
description = "Stepwise VG2 compiler migration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasyncx==1.1.6",
    "keyring==25.7.0",
    "pandas==3.0.3"
]

[project.scripts]
vg2c = "vg2c.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
search-path = ["src"]
