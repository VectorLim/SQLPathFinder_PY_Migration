name: UI refactor CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/vg2c_ui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/vg2c_ui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pydantic>=2.11,<3'
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vg2c-ui-static
          path: src/vg2c_ui/static
          if-no-files-found: error

  backend-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8.4,<10' 'fastapi>=0.116,<1' 'pydantic>=2.11,<3' 'pandas==3.0.3'
      - run: python -m pytest tests/ui/test_document_store.py
