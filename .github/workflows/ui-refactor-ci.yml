name: UI refactor CI

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths-ignore:
      - 'src/vg2c_ui/static/**'
      - 'docs/ui-verification/**'
  pull_request:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/vg2c_ui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/vg2c_ui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pydantic>=2.11,<3' 'selenium>=4.35,<5'
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify desktop, tablet and mobile layouts
        working-directory: .
        run: |
          mkdir -p docs/ui-verification
          python -m http.server 4173 --directory src/vg2c_ui/static >/tmp/vg2c-ui-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          python - <<'PY'
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          cases = [
              ("desktop", 1440, 900),
              ("tablet", 900, 1100),
              ("mobile", 390, 844),
          ]
          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-gpu")
          options.add_argument("--hide-scrollbars")
          driver = webdriver.Chrome(options=options)
          out = Path("docs/ui-verification")
          try:
              for name, width, height in cases:
                  driver.set_window_size(width, height)
                  driver.get("http://127.0.0.1:4173")
                  WebDriverWait(driver, 10).until(EC.presence_of_element_located((By.CSS_SELECTOR, ".app-shell")))
                  metrics = driver.execute_script("""
                    const fab = document.querySelector('.add-files-button').getBoundingClientRect();
                    const context = getComputedStyle(document.querySelector('.context-sidebar'));
                    return {
                      innerWidth: window.innerWidth,
                      innerHeight: window.innerHeight,
                      scrollWidth: document.documentElement.scrollWidth,
                      fab: {left: fab.left, right: fab.right, top: fab.top, bottom: fab.bottom},
                      contextPosition: context.position,
                      contextBottom: context.bottom,
                      contextRight: context.right,
                      contextWidth: parseFloat(context.width),
                    };
                  """)
                  assert metrics["scrollWidth"] <= metrics["innerWidth"], (name, metrics)
                  assert metrics["fab"]["left"] >= 0 and metrics["fab"]["right"] <= metrics["innerWidth"], (name, metrics)
                  assert metrics["fab"]["top"] >= 0 and metrics["fab"]["bottom"] <= metrics["innerHeight"], (name, metrics)
                  if name == "tablet":
                      assert metrics["contextPosition"] == "fixed" and metrics["contextRight"] == "0px", metrics
                  if name == "mobile":
                      assert metrics["contextPosition"] == "fixed" and metrics["contextBottom"] == "0px", metrics
                      assert metrics["contextWidth"] >= metrics["innerWidth"] - 2, metrics
                  driver.save_screenshot(str(out / f"{name}-{width}x{height}.png"))
                  print(name, metrics)
          finally:
              driver.quit()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vg2c-ui-verification
          path: |
            src/vg2c_ui/static
            docs/ui-verification
          if-no-files-found: error
      - name: Commit production assets and viewport screenshots
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vg2c_ui/static docs/ui-verification
          if ! git diff --cached --quiet; then
            git commit -m 'Build responsive UI assets and verification screenshots'
            git push
          fi

  backend-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8.4,<10' 'fastapi>=0.116,<1' 'pydantic>=2.11,<3' 'pandas==3.0.3' 'keyring>=25.6,<26'
      - run: python -m pytest tests/ui/test_document_store.py
