name: Session 2.5A ScriptHost Audit

on:
  push:
    branches:
      - direct-runtime/session-2-utilities-integrations

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore authoritative decompiled module
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s scripthost-utilities-decompiled/SPSQL3_py/SPFLib/SPFSQL3.py ]; then
            rm -rf /tmp/spsql3
            mkdir -p /tmp/spsql3
            unzip -q scripthost-utilities-decompiled/SPSQL3_py.zip -d /tmp/spsql3
            cp /tmp/spsql3/SPFLib/SPFSQL3.py scripthost-utilities-decompiled/SPSQL3_py/SPFLib/SPFSQL3.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripthost-utilities-decompiled/SPSQL3_py/SPFLib/SPFSQL3.py
            git commit -m "chore: restore authoritative decompiled SPFSQL3 source"
            git push
          fi
      - name: Verify restored source
        run: |
          test -s scripthost-utilities-decompiled/SPSQL3_py/SPFLib/SPFSQL3.py
          python - <<'PY'
          from pathlib import Path
          p=Path("scripthost-utilities-decompiled/SPSQL3_py/SPFLib/SPFSQL3.py")
          print("restored_lines", len(p.read_text(encoding="utf-8-sig", errors="replace").splitlines()))
          PY
