name: Session 2.5A ScriptHost Audit

on:
  push:
    branches:
      - direct-runtime/session-2-utilities-integrations

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export authoritative decompiled module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/spsql3
          mkdir -p /tmp/spsql3
          unzip -q scripthost-utilities-decompiled/SPSQL3_py.zip -d /tmp/spsql3
          python - <<'PY'
          import base64
          from pathlib import Path
          p = Path("/tmp/spsql3/SPFLib/SPFSQL3.py")
          raw = p.read_bytes()
          data = base64.b64encode(raw).decode("ascii")
          width = 48000
          print(f"SPFSQL3_EXPORT bytes={len(raw)} chunks={(len(data)+width-1)//width}")
          for idx in range(0, len(data), width):
              print(f"SPFSQL3_CHUNK {idx//width:04d} {data[idx:idx+width]}")
          print("SPFSQL3_EXPORT_END")
          PY
