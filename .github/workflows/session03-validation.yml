name: Session 03 CSV and Table Validation
on:
  push:
    branches:
      - refactor/generated-code/implementation
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "pandas==3.0.3" "keyring==25.7.0" oracledb fastapi pydantic uvicorn python-multipart httpx2 ruff
          python -m pip install --no-deps -e .
      - name: Compile sources
        run: python -m compileall -q src
      - name: Lint changed runtime
        run: ruff check src/vg2c/runtime/csv_io.py src/vg2c/runtime/crosstab.py
      - name: Session 03 focused tests
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q tests/runtime/test_csv_io.py tests/runtime/test_direct_runtime.py tests/runtime/test_e2e_fixtures.py tests/runtime/test_job_runtime.py tests/emitter/test_generated_project.py tests/emitter/test_sqlite_table_bindings.py
      - name: Entire test suite
        if: always()
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q
