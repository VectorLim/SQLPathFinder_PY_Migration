name: Session 03 CSV and Table Validation
on:
  push:
    branches:
      - refactor/generated-code/implementation
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "pandas==3.0.3" "keyring==25.7.0" oracledb fastapi pydantic uvicorn python-multipart httpx2 ruff
          python -m pip install --no-deps -e .
      - name: Compile sources
        run: python -m compileall -q src
      - name: Lint runtime, emitter and utilities
        run: ruff check --select F821,F823 src/vg2c/runtime src/vg2c/emitter src/vg2c/utilities
      - name: Session 03 focused tests
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q tests/runtime/test_html_assets_session04.py tests/runtime/test_direct_html.py tests/runtime/test_table_semantics_session03.py tests/runtime/test_crosstab_script_host_parity.py tests/runtime/test_crosstab_corrective_pass.py tests/runtime/test_csv_io.py tests/runtime/test_direct_runtime.py tests/runtime/test_e2e_fixtures.py tests/runtime/test_job_runtime.py tests/emitter/test_generated_project.py tests/emitter/test_sqlite_table_bindings.py
      - name: Entire runtime and emitter suites
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests/runtime tests/emitter
      - name: Representative table call and synthetic join benchmark
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile, time, tracemalloc
          from vg2c import compile_document
          from vg2c.runtime import SqliteReader
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              keys = [f'k{i}' for i in range(28)]
              body = 'SELECT ' + ', '.join(f"'{i}' AS {key}" for i, key in enumerate(keys)) + ", 'A' AS metric, 'v' AS value"
              source = root / 'pivot.txt'
              source.write_text('<OPTIONS>\n/ENGINE=SQLite\n/CSV=out.csv\n/CTROW=' + ','.join(keys) + '\n/CTHEADER=metric\n/CTVALUE=value\n</OPTIONS>\n' + body)
              emitted = compile_document(source).emitted
              line = next(line.strip() for line in emitted.source.splitlines() if 'pivot_columns=' in line)
              assert not any(name.endswith('.crosstab.json') for name, _ in emitted.assets)
              print('TABLE_SOURCE_CALL:', line)
              print('TABLE_PIVOT_KWARG_CHARS:', len(line))
              print('TABLE_STATIC_JSON_ASSETS:', sum(name.endswith('.crosstab.json') for name, _ in emitted.assets))
              for n in (10000, 75000):
                  left = root / 'left.csv'
                  right = root / 'right.csv'
                  left.write_text('id,code\n' + ''.join(f'{i:06d},x\n' for i in range(n)))
                  right.write_text('id,label\n' + ''.join(f'{i:06d},y\n' for i in range(n)))
                  tracemalloc.start()
                  tick = time.perf_counter()
                  data = SqliteReader().execute(
                      'SELECT a.id, b.label FROM [L] a JOIN [R] b ON a.id = b.id',
                      [(str(left), 'L'), (str(right), 'R')],
                  )
                  elapsed = time.perf_counter() - tick
                  peak = tracemalloc.get_traced_memory()[1]
                  tracemalloc.stop()
                  print(f'JOIN_BENCH: rows={n}, result_rows={len(data)}, elapsed_s={elapsed:.3f}, peak_alloc_mb={peak/1048576:.1f}')
              import pandas as pd
              from vg2c.runtime.crosstab import _CrosstabUtility as CrosstabUtility
              for n in (10000, 75000):
                  pivot_source = pd.DataFrame({
                      'id': [f'{i:06d}' for i in range(n)],
                      'metric': ['A' if i % 2 else 'B' for i in range(n)],
                      'value': [str(i) for i in range(n)],
                  })
                  tracemalloc.start()
                  tick = time.perf_counter()
                  pivoted = CrosstabUtility().apply(
                      pivot_source, pivot_columns='metric', pivot_values='value'
                  )
                  elapsed = time.perf_counter() - tick
                  peak = tracemalloc.get_traced_memory()[1]
                  tracemalloc.stop()
                  assert len(pivoted) == n
                  print(f'PIVOT_BENCH: rows={n}, result_rows={len(pivoted)}, elapsed_s={elapsed:.3f}, peak_alloc_mb={peak/1048576:.1f}')
          PY
      - name: Generated project readability metrics (compile only)
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from vg2c import compile_document
          original = Path("ICMPCS/main.py").read_text(encoding="utf-8")
          emitted = compile_document(Path("ICMPCS.txt")).emitted
          updated = emitted.source
          def stats(source):
              syntax = ast.parse(source)
              relevant = (ast.Assign, ast.AnnAssign, ast.Expr, ast.AugAssign)
              sizes = [len(ast.get_source_segment(source, node) or "") for node in ast.walk(syntax)
                       if isinstance(node, relevant)]
              return {
                  "lines": len(source.splitlines()),
                  "simple_statements": len(sizes),
                  "max_simple_statement_chars": max(sizes, default=0),
                  "styles_assignments": sum(line.strip().startswith(("styles[", "job.styles[")) for line in source.splitlines()),
                  "css_file_assignments": sum(line.strip().startswith(("css_file =", "job.css_file =")) for line in source.splitlines()),
                  "csv_report_calls": source.count("csv_report("),
                  "html_calls": source.count("job.html("),
              }
          names = [name for name, _ in emitted.assets]
          print("LEGACY_ICMPCS_MAIN_METRICS", stats(original))
          print("NEW_ICMPCS_MAIN_METRICS", stats(updated))
          print("EDITABLE_ASSET_COUNTS", {
              "sql": sum(name.endswith(".sql") for name in names),
              "html": sum(name.endswith(".html") for name in names),
              "css": sum(name.endswith(".css") for name in names),
              "report_json": sum(name.endswith(".report.json") for name in names),
          })
          PY
      - name: Entire test suite
        if: always()
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q
