name: Compiler and Runtime Validation
on:
  push:
    branches:
      - refactor/generated-code/implementation
      - html_sql-rework
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff "pandas==3.0.3" "duckdb==1.5.6" oracledb python-dotenv uv
          python -m pip install --no-deps -e .
      - name: Compile sources
        run: python -m compileall -q src
      - name: Check Python names and imports
        run: ruff check --select F src tests
      - name: Entire test suite
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q
