name: Direct Runtime Validation

on:
  push:
    branches:
      - direct-runtime/session-2-utilities-integrations
      - direct-runtime/session-3-**

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install pytest ruff pandas requests openpyxl xlrd
      - name: Format and autofix direct runtime
        run: |
          ruff format src/vg2c_new tests/vg2c_new
          ruff check src/vg2c_new tests/vg2c_new --ignore E501 --fix --exit-zero
          ruff check src/vg2c_new tests/vg2c_new --ignore E501
      - name: Commit formatter changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/vg2c_new tests/vg2c_new
            git commit -m "style: format direct runtime"
            git push
          fi
      - name: Compile direct runtime
        run: python -m compileall -q src/vg2c_new
      - name: Direct runtime tests
        env:
          PYTHONPATH: src:.
        run: pytest tests/vg2c_new -q
      - name: Ruff
        run: ruff check src/vg2c_new tests/vg2c_new --ignore E501
