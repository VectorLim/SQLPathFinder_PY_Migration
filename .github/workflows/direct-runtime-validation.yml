name: Direct Runtime Validation

on:
  workflow_dispatch:
  push:
    branches:
      - direct-runtime/utility-convergence-audit

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install R for original interpreter validation
        run: command -v R || (sudo apt-get update && sudo apt-get install -y r-base-core)
      - name: Format check
        run: ruff format --check src/scripthost_portable tests/scripthost_portable scripts/architecture
      - name: Compile direct runtime
        run: python -m compileall -q src/scripthost_portable
      - name: Compile portable ScriptHost targets
        run: python -m compileall -q scripthost-utilities-decompiled/SPSQL3_py/SPFLib/__init__.py scripthost-utilities-decompiled/SPSQL3_py/SPFLib/SPFSQL3.py scripthost-utilities-decompiled/SPSQL3_py/SPFLib/SPFGlobals.py scripthost-utilities-decompiled/SPSQL3_py/SPFLib/SPFUtilities/memtable.py scripthost-utilities-decompiled/SPSQL3_py/SPFLib/SPFUtilities/utils.py scripthost-utilities-decompiled/SPSQL3_py/PyUtils.py scripthost-utilities-decompiled/SPSQL3_py/PyGraphingMethods.py scripthost-utilities-decompiled/SPSQL3_py/PyPlot_Class.py scripthost-utilities-decompiled/SPSQL3_py/AutoComm_HTML_Report.py
      - name: Direct runtime tests
        env:
          PYTHONPATH: src:.
        run: pytest tests/scripthost_portable -q
      - name: Process isolation benchmark
        env:
          PYTHONPATH: src:.
        run: python scripts/architecture/benchmark_scripthost_isolation.py
      - name: Ruff
        run: ruff check src/scripthost_portable tests/scripthost_portable scripts/architecture --ignore E501

  container:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime and validation images
        run: |
          docker build --target final -t scripthost-runtime .
          docker build --target validation -t scripthost-validation .
      - name: Validate original runtime as non-root
        run: docker run --rm scripthost-validation
      - name: Check production launcher
        run: |
          docker run --rm scripthost-runtime --help
          docker run --rm --entrypoint python scripthost-runtime -c '
          import json, pathlib, subprocess, tempfile
          root = pathlib.Path(tempfile.mkdtemp())
          script = root / "smoke.spfsql"
          script.write_text("<OPTIONS>\n/WRITE-FILE=Y\n/CSV=result.txt\n</OPTIONS>\ncontainer")
          run = subprocess.run(["python", "-m", "scripthost_portable.launcher", str(script), "--workdir", str(root)], capture_output=True, text=True)
          assert run.returncode == 0, run.stderr + run.stdout
          assert json.loads(run.stdout)["success"]
          assert (root / "result.txt").read_text() == "container"
          '
