name: Direct Runtime Validation

on:
  push:
    branches:
      - direct-runtime/session-2-utilities-integrations
      - direct-runtime/session-2.5a-portability-reuse-audit
      - direct-runtime/architecture-reassessment-portable-scripthost
      - direct-runtime/session-3-**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install pytest ruff pandas requests openpyxl xlrd
      - name: Archive runtime inventory
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          archive = Path("scripthost-utilities-decompiled/SPSQL3_py.zip")
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
          print("archive_python_files", sum(name.lower().endswith(".py") for name in names))
          for name in names:
              lower = name.lower()
              if "dbdriver" in lower or lower.endswith("spflib/spfsql3.py") or lower.endswith("spflib/spfglobals.py"):
                  print("archive_runtime_entry", name)
          PY
      - name: Format check
        run: ruff format --check src/vg2c_new tests/vg2c_new
      - name: Compile direct runtime
        run: python -m compileall -q src/vg2c_new
      - name: Compile portable ScriptHost targets
        run: python -m compileall -q scripthost-utilities-decompiled/SPSQL3_py/SPFLib/__init__.py scripthost-utilities-decompiled/SPSQL3_py/PyUtils.py scripthost-utilities-decompiled/SPSQL3_py/PyGraphingMethods.py scripthost-utilities-decompiled/SPSQL3_py/PyPlot_Class.py scripthost-utilities-decompiled/SPSQL3_py/AutoComm_HTML_Report.py
      - name: Direct runtime tests
        env:
          PYTHONPATH: src:.
        run: pytest tests/vg2c_new -q
      - name: Manifest status summary
        env:
          PYTHONPATH: src:.
        run: python -c "from collections import Counter; from vg2c_new.parser import RESOLVER_MANIFEST; print(Counter(row[6] for row in RESOLVER_MANIFEST))"
      - name: Ruff
        run: ruff check src/vg2c_new tests/vg2c_new --ignore E501
