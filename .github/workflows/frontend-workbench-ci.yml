name: Frontend Workbench Iteration

on:
  push:
    branches: [improv-frontend]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: python -m pip install pydantic fastapi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/vg2c_ui/frontend/package-lock.json
      - name: Frontend checks
        working-directory: src/vg2c_ui/frontend
        env:
          PYTHONPATH: ../../../src:../../..
        run: |
          npm ci
          npm test
          npm run build
