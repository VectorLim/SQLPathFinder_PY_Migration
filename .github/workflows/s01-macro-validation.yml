name: Session 01 Macro Validation
on:
  push:
    branches:
      - refactor/generated-code/s01-macros

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "pandas==3.0.3" "keyring==25.7.0" oracledb fastapi pydantic uvicorn python-multipart httpx2 ruff
          python -m pip install --no-deps -e .
      - name: Compile sources
        run: python -m compileall -q src
      - name: Ruff new macro store
        run: ruff check src/vg2c/runtime/macros.py
      - name: Sanitized generated-code metrics
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import re
          import tempfile
          from pathlib import Path
          from vg2c import compile_document
          def block(options, body=''):
              return '<OPTIONS>\n' + options + '\n</OPTIONS>\n' + body + '\n<---- New Query ---->\n'
          content = (
              block('/UTILITIES={START-MACRO} "config.csv" "N"')
              + block('/UTILITIES={ROWS-IN-FILE} "rows.csv" "COUNT" "N"')
              + block('/UTILITIES={IF-THEN} "COUNT" "GT" "0" "" "" "" ""')
              + block('/WRITE-FILE=Y\n/CSV=chosen.txt', '<<<LABEL>>>')
              + block('/UTILITIES={END-IF}')
              + block('/UTILITIES={START-MACRO} "inner.csv" "N"')
              + block('/WRITE-FILE=Y\n/CSV=inner.txt', '<<<LABEL>>>')
              + block('/UTILITIES={END-MACRO}')
              + block('/UTILITIES={END-MACRO}')
          )
          with tempfile.TemporaryDirectory() as tmp:
              source = Path(tmp) / 'sanitized.txt'
              source.write_text(content, encoding='utf-8')
              code = compile_document(source).emitted.source
          print('METRICS: lines=', len(code.splitlines()),
                ' numbered_macro_mentions=', len(re.findall(r'macro_values_\d+', code)),
                ' substitutions=', code.count('substitute('),
                ' contexts=', code.count('.scope('),
                ' bracket_reads=', len(re.findall(r"macros\[['\"]COUNT['\"]\]", code)))
          PY
      - name: Run focused macro tests
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests/runtime/test_scoped_macros.py tests/emitter/test_macro_store_project.py tests/runtime/test_macro_state.py tests/runtime/test_control_parity.py tests/runtime/test_placeholder_substitution.py tests/emitter/test_generated_project.py tests/emitter/test_semantic_contracts.py
      - name: Run full test suite
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q

  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d9211c81c4f72651329611aabfb2bc5c6abba504
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install identical test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "pandas==3.0.3" "keyring==25.7.0" oracledb fastapi pydantic uvicorn python-multipart httpx2 ruff
          python -m pip install --no-deps -e .
      - name: Sanitized generated-code metrics
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
