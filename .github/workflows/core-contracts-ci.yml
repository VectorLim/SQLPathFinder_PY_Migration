name: Core Contracts CI

on:
  push:
    branches: [improv-core]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public test dependencies
        run: python -m pip install pytest ruff fastapi pydantic uvicorn pandas keyring python-multipart
      - name: Core tests
        env:
          PYTHONPATH: src:.
        run: pytest -q tests/resolver tests/emitter tests/dataflow tests/ui
      - name: Generate contract handoff
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/generate_frontend_contracts.py
          printf 'VG2C_CONTRACTS_B64='
          base64 -w0 src/vg2c_ui/frontend/src/contracts.generated.ts
          printf '\n'
      - name: Contract check
        env:
          PYTHONPATH: src:.
        run: python scripts/generate_frontend_contracts.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/vg2c_ui/frontend/package-lock.json
      - name: Frontend contract/type/state tests
        working-directory: src/vg2c_ui/frontend
        run: |
          npm ci
          npm test
